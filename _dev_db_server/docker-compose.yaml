version: '3.1'

services:
  db:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: geheim321
      MARIADB_DATABASE: wcinfo
      MARIADB_USER: wcinfo
      MARIADB_PASSWORD: wcinfo
    volumes:
      - ./import:/docker-entrypoint-initdb.d
      - ./data:/var/lib/mysql
    ports:
      - "0.0.0.0:3306:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: geheim321
    ports:
      - "0.0.0.0:8081:80"